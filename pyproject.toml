[project]
name = "knowlet"
version = "0.0.1"
description = "A personal knowledge base that organizes itself."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Jolan" }]
dependencies = [
    "openai>=1.40",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "python-frontmatter>=1.1",
    "mistune>=3.0",
    "watchdog>=4.0",
    "python-ulid>=2.7",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # python-multipart is fastapi's dep for `UploadFile` / multipart form data;
    # used by /api/attachments (M7.0.3 image-paste).
    "python-multipart>=0.0.9",
    "fsrs>=6.0",
    "feedparser>=6.0",
    "trafilatura>=1.12",
    # APScheduler 3.x: stable BackgroundScheduler API used in core/mining/scheduler.py.
    # The 4.x line (alpha as of writing) is a substantial rewrite — async-first, new
    # data-store / scheduler split, breaking API. Stay on 3 until 4 stabilizes.
    "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=2.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[project.scripts]
knowlet = "knowlet.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["knowlet"]

[tool.hatch.build.targets.sdist]
include = ["knowlet", "README.md", "README.en.md", "LICENSE", "docs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Per ADR-0020 §Layer 2.
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "B",           # bugbear
    "I",           # isort
    "UP",          # pyupgrade
    "RUF",         # ruff-specific
    "SIM",         # simplify
    "S",           # security (bandit-like)
]
ignore = [
    "E501",        # line length handled by formatter
    "S101",        # assert in tests is fine
    "B008",        # default arg in function call (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]  # security rules irrelevant in tests
"scripts/**/*.py" = ["S"]

[tool.mypy]
# Per ADR-0020 §Layer 1. Strict mode catches a class of runtime AttributeError /
# TypeError / None-deref bugs at type-check time. First run is expected to expose
# 50-100 holes; subsequent commits stay clean via pre-commit + CI.
python_version = "3.11"
strict = true
disallow_untyped_defs = true
disallow_any_unimported = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party libraries without type stubs. Allow Any to leak from these
# boundaries only; the rest of the codebase stays typed.
module = [
    "sqlite_vec",
    "trafilatura",
    "trafilatura.*",
    "feedparser",
    "fsrs",
    "ulid",
    "frontmatter",
    "mistune",
    "mistune.*",
    "apscheduler.*",
    "watchdog.*",
    "sentence_transformers",
    "sentence_transformers.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
