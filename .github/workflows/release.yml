name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.0.1"
        required: true
        type: string
      runner:
        description: "Runner label. Use macos-15 for hosted CI, or self-hosted for a local signing machine."
        required: true
        default: "macos-15"
        type: choice
        options:
          - "macos-15"
          - "self-hosted"
      replace_existing_assets:
        description: "Replace assets on an existing GitHub release. Leave false for normal releases."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  macos-desktop:
    name: Build notarized macOS desktop package
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && 'knowlet-release' || 'macos-15' }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      LC_CTYPE: en_US.UTF-8
    steps:
      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            git_ref="refs/tags/$tag"
          else
            tag="${GITHUB_REF_NAME}"
            git_ref="${GITHUB_REF}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.0.1 or v0.0.1-beta.1: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "git_ref=$git_ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.git_ref }}
          fetch-depth: 0

      - name: Verify release tag exists
        run: git rev-parse --verify "refs/tags/${{ steps.release.outputs.tag }}"

      - name: Guard against accidental release replacement
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_EXISTING_ASSETS: ${{ inputs.replace_existing_assets }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1 && [[ "$REPLACE_EXISTING_ASSETS" != "true" ]]; then
            echo "GitHub release already exists for $tag." >&2
            echo "Re-run manually with replace_existing_assets=true only when intentionally replacing release assets." >&2
            exit 1
          fi

      - name: Set up Node with npm cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.runner != 'self-hosted' }}
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Node without npm cache
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' }}
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Install Rosetta for Intel sidecar build
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" == "arm64" ]]; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --fund=false

      - name: Install Apple signing assets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.runner != 'self-hosted' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD }}
          KEYCHAIN_PATH: ${{ runner.temp }}/knowlet-signing.keychain-db
          CERTIFICATE_PATH: ${{ runner.temp }}/developer-id-application.p12
          API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_BASE64 APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD SIGNING_KEYCHAIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          certificate_path = Path(os.environ["CERTIFICATE_PATH"])
          api_key_path = Path(os.environ["API_KEY_PATH"])
          api_key_path.parent.mkdir(parents=True, exist_ok=True)
          certificate_path.write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE_BASE64"]))
          api_key_path.write_bytes(base64.b64decode(os.environ["APPLE_API_KEY_BASE64"]))
          api_key_path.chmod(0o600)
          PY

          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$SIGNING_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build signed and notarized DMG with hosted signing assets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.runner != 'self-hosted' }}
        working-directory: frontend
        env:
          KNOWLET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build

      - name: Build signed and notarized DMG with local keychain
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' }}
        working-directory: frontend
        env:
          KNOWLET_APPLE_TEAM_ID: N8384H66R9
          KNOWLET_NOTARY_PROFILE: knowlet-notary
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          unset APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH
          npm run desktop:build

      - name: Verify desktop release artifact
        id: artifact
        run: |
          set -euo pipefail
          version="$(node -e 'const fs = require("fs"); const config = JSON.parse(fs.readFileSync("frontend/src-tauri/tauri.conf.json", "utf8")); console.log(config.version);')"
          dmg="frontend/src-tauri/target/universal-apple-darwin/release/bundle/dmg/Knowlet_${version}_universal.dmg"
          app="frontend/src-tauri/target/universal-apple-darwin/release/bundle/macos/Knowlet.app"
          updater="frontend/src-tauri/target/universal-apple-darwin/release/bundle/macos/Knowlet.app.tar.gz"
          updater_sig="$updater.sig"
          test -f "$dmg"
          test -f "$updater"
          test -s "$updater_sig"
          test -x "$app/Contents/MacOS/knowlet-backend"
          test -x "$app/Contents/Resources/knowlet-sidecars/knowlet-backend-aarch64-apple-darwin"
          test -x "$app/Contents/Resources/knowlet-sidecars/knowlet-backend-x86_64-apple-darwin"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          scripts/desktop/verify-dmg-install.sh "$dmg"
          shasum -a 256 "$dmg" | tee "Knowlet_${version}_universal.dmg.sha256"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "sha=Knowlet_${version}_universal.dmg.sha256" >> "$GITHUB_OUTPUT"
          echo "updater=$updater" >> "$GITHUB_OUTPUT"
          echo "updater_sig=$updater_sig" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: scripts/release/release-notes.sh "${{ steps.release.outputs.tag }}" > release-notes.md

      - name: Write updater manifest
        env:
          RELEASE_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          updater_name="$(basename "${{ steps.artifact.outputs.updater }}")"
          scripts/release/write-latest-json.mjs \
            --version "${{ steps.artifact.outputs.version }}" \
            --notes-file release-notes.md \
            --pub-date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --url "$RELEASE_URL_PREFIX/$updater_name" \
            --signature-file "${{ steps.artifact.outputs.updater_sig }}" \
            --out latest.json
          node -e 'const fs = require("fs"); const doc = JSON.parse(fs.readFileSync("latest.json", "utf8")); for (const key of ["darwin-aarch64", "darwin-x86_64"]) { if (!doc.platforms[key]?.url || !doc.platforms[key]?.signature) process.exit(1); }'

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_EXISTING_ASSETS: ${{ inputs.replace_existing_assets }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$REPLACE_EXISTING_ASSETS" != "true" ]]; then
              echo "GitHub release already exists for $tag; refusing to replace assets." >&2
              exit 1
            fi
            gh release upload "$tag" \
              "${{ steps.artifact.outputs.dmg }}" \
              "${{ steps.artifact.outputs.sha }}" \
              "${{ steps.artifact.outputs.updater }}" \
              "${{ steps.artifact.outputs.updater_sig }}" \
              latest.json \
              --clobber
          else
            gh release create "$tag" \
              "${{ steps.artifact.outputs.dmg }}" \
              "${{ steps.artifact.outputs.sha }}" \
              "${{ steps.artifact.outputs.updater }}" \
              "${{ steps.artifact.outputs.updater_sig }}" \
              latest.json \
              --title "Knowlet $tag" \
              --notes-file release-notes.md \
              --verify-tag \
              --latest
          fi
