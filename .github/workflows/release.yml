name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, for example v0.0.1"
        required: true
        type: string
      runner:
        description: "Runner label. Use macos-15 for hosted CI, or self-hosted for a local signing machine."
        required: true
        default: "macos-15"
        type: choice
        options:
          - "macos-15"
          - "self-hosted"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  macos-desktop:
    name: Build notarized macOS desktop package
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' && 'knowlet-release' || 'macos-15' }}
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      LC_CTYPE: en_US.UTF-8
    steps:
      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            git_ref="refs/tags/$tag"
          else
            tag="${GITHUB_REF_NAME}"
            git_ref="${GITHUB_REF}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.0.1 or v0.0.1-beta.1: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "git_ref=$git_ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.git_ref }}
          fetch-depth: 0

      - name: Verify release tag exists
        run: git rev-parse --verify "refs/tags/${{ steps.release.outputs.tag }}"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Rosetta for Intel sidecar build
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" == "arm64" ]]; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi

      - name: Install Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Apple signing assets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.runner != 'self-hosted' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD }}
          KEYCHAIN_PATH: ${{ runner.temp }}/knowlet-signing.keychain-db
          CERTIFICATE_PATH: ${{ runner.temp }}/developer-id-application.p12
          API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_BASE64 APPLE_CERTIFICATE_BASE64 APPLE_CERTIFICATE_PASSWORD SIGNING_KEYCHAIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          certificate_path = Path(os.environ["CERTIFICATE_PATH"])
          api_key_path = Path(os.environ["API_KEY_PATH"])
          api_key_path.parent.mkdir(parents=True, exist_ok=True)
          certificate_path.write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE_BASE64"]))
          api_key_path.write_bytes(base64.b64decode(os.environ["APPLE_API_KEY_BASE64"]))
          api_key_path.chmod(0o600)
          PY

          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$SIGNING_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Build signed and notarized DMG with hosted signing assets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.runner != 'self-hosted' }}
        working-directory: frontend
        env:
          KNOWLET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
        run: npm run desktop:build

      - name: Build signed and notarized DMG with local keychain
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'self-hosted' }}
        working-directory: frontend
        env:
          KNOWLET_APPLE_TEAM_ID: N8384H66R9
          KNOWLET_NOTARY_PROFILE: knowlet-notary
        run: |
          unset APPLE_API_KEY APPLE_API_ISSUER APPLE_API_KEY_PATH
          npm run desktop:build

      - name: Verify desktop release artifact
        id: artifact
        run: |
          set -euo pipefail
          dmg="frontend/src-tauri/target/universal-apple-darwin/release/bundle/dmg/Knowlet_0.0.1_universal.dmg"
          app="frontend/src-tauri/target/universal-apple-darwin/release/bundle/macos/Knowlet.app"
          test -f "$dmg"
          test -x "$app/Contents/MacOS/knowlet-backend"
          test -x "$app/Contents/Resources/knowlet-sidecars/knowlet-backend-aarch64-apple-darwin"
          test -x "$app/Contents/Resources/knowlet-sidecars/knowlet-backend-x86_64-apple-darwin"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          xcrun stapler validate "$dmg"
          shasum -a 256 "$dmg" | tee Knowlet_0.0.1_universal.dmg.sha256
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          echo "sha=Knowlet_0.0.1_universal.dmg.sha256" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          First Knowlet macOS desktop dogfood build.

          This release includes:
          - Universal macOS app for Apple Silicon and Intel Macs.
          - Self-contained React frontend bundle.
          - Self-contained Python backend sidecars packaged with the app.
          - Developer ID signing, Apple notarization, stapling, and Gatekeeper verification.

          Known gaps:
          - No auto-update flow yet.
          - No menu bar/background Stage C pull surface yet.
          - LLM provider credentials remain user/vault configuration and are not bundled.
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "${{ steps.artifact.outputs.dmg }}" \
              "${{ steps.artifact.outputs.sha }}" \
              --clobber
          else
            gh release create "$tag" \
              "${{ steps.artifact.outputs.dmg }}" \
              "${{ steps.artifact.outputs.sha }}" \
              --title "Knowlet $tag" \
              --notes-file release-notes.md \
              --verify-tag \
              --latest
          fi
