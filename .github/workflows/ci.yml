name: CI

on:
  push:
    branches: [main]
  pull_request:

# Per ADR-0020 §Layer 4. Mirrors the pre-commit hooks (so a contributor who
# bypasses local hooks still gets caught here) and adds coverage upload.

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra embed --extra sync

      - name: ruff lint
        run: uv run ruff check

      - name: ruff format check
        run: uv run ruff format --check

      - name: mypy strict
        run: uv run mypy knowlet

      - name: pytest with coverage
        run: uv run pytest --cov=knowlet --cov-report=xml --cov-report=term

      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend deps (e2e fixture spawns it)
        run: uv sync --extra dev --extra embed --extra sync

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: e2e tests
        working-directory: frontend
        env:
          SKIP_BUILD: "1"
        run: node scripts/e2e/run-all.mjs

  desktop:
    # The Tauri shell only ships for macOS; check it on the same OS the release
    # workflow builds on so Rust breakage surfaces on the PR, not mid-release.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            frontend/src-tauri/target
          key: cargo-check-${{ runner.os }}-${{ hashFiles('frontend/src-tauri/Cargo.lock') }}
          restore-keys: |
            cargo-check-${{ runner.os }}-

      - name: Stub bundle inputs required by tauri-build
        # tauri-build checks that externalBin, resources and frontendDist exist
        # at compile time. cargo check never bundles them, so placeholders do.
        run: |
          set -euo pipefail
          mkdir -p frontend/dist frontend/src-tauri/binaries
          [[ -f frontend/dist/index.html ]] || echo '<!doctype html><title>Knowlet</title>' > frontend/dist/index.html
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            bin="frontend/src-tauri/binaries/knowlet-backend-$triple"
            : > "$bin"
            chmod 755 "$bin"
          done

      - name: cargo check (src-tauri)
        working-directory: frontend/src-tauri
        run: cargo check --locked --all-targets
