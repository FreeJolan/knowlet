name: CI

on:
  push:
    branches: [main]
  pull_request:

# Per ADR-0020 §Layer 4. Mirrors the pre-commit hooks (so a contributor who
# bypasses local hooks still gets caught here) and adds coverage upload.

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra embed

      - name: ruff lint
        run: uv run ruff check

      - name: ruff format check
        run: uv run ruff format --check

      - name: mypy strict
        run: uv run mypy knowlet

      - name: pytest with coverage
        run: uv run pytest --cov=knowlet --cov-report=xml --cov-report=term

      - uses: codecov/codecov-action@v5
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend deps (e2e fixture spawns it)
        run: uv sync --extra dev --extra embed

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: e2e tests
        working-directory: frontend
        env:
          SKIP_BUILD: "1"
        run: node scripts/e2e/run-all.mjs
