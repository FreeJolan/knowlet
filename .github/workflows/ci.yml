name: CI

on:
  push:
    branches: [main]
  pull_request:

# Per ADR-0020 §Layer 4. Mirrors the pre-commit hooks (so a contributor who
# bypasses local hooks still gets caught here) and adds coverage upload.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra embed

      - name: ruff lint
        run: uv run ruff check

      - name: ruff format check
        run: uv run ruff format --check

      - name: mypy strict
        run: uv run mypy knowlet

      - name: pytest with coverage
        run: uv run pytest --cov=knowlet --cov-report=xml --cov-report=term

      - uses: codecov/codecov-action@v5
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false
